<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050a14">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FOCUS">
    <link rel="icon" href="icon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>تطبيق تركيز | FOCUS - تطبيق التركيز والمذاكرة</title>
    <meta name="description" content="تطبيق تركيز مجاني بالعربي: مؤقت دائري، أصوات هادئة، جدول مواعيد، ومواقيت صلاة.">
    <style>
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100vh; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #050a14; color: #fff; overflow-x: hidden; }
        body { overscroll-behavior: none; }
        button, input, select { font-family: inherit; outline: none; }
        button { -webkit-user-select: none; user-select: none; }

        #intro { position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; align-items: center; justify-content: center; }
        #intro img { width: min(65vw, 260px); max-height: 65vh; object-fit: contain; opacity: 0; animation: introDrop 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
        @keyframes introDrop { 0% { opacity: 0; transform: translateY(-120px) scale(.92); } 65% { opacity: 1; transform: translateY(8px) scale(1.02); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        #intro.hide { animation: introOut .5s ease forwards; }
        @keyframes introOut { to { opacity: 0; visibility: hidden; } }

        #app { width: 100%; max-width: 680px; margin: 0 auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 22px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { width: 48px; height: 48px; object-fit: contain; border-radius: 14px; }
        .brand-text h1 { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #fff 0%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn { width: 46px; height: 46px; border-radius: 14px; border: 1px solid #1a293e; background: #0d1726; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .2s ease; }
        .icon-btn:active { transform: scale(.92); }

        .timer-card { background: #0b1322; border: 1px solid #162438; border-radius: 32px; padding: 30px 16px 36px; text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; }
        .circle-container { position: relative; width: min(85vw, 380px); height: min(85vw, 380px); margin: 0 auto; touch-action: none; user-select: none; }
        .circle-svg { width: 100%; height: 100%; overflow: visible; }
        .circle-track { fill: none; stroke: #ffffff; stroke-width: 16; opacity: .92; }
        .circle-progress { fill: none; stroke: url(#blueGradient); stroke-width: 16; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 180px 180px; opacity: 0; transition: stroke-dashoffset .35s linear, opacity .45s ease; }
        body.timer-running .circle-progress { opacity: 1; }
        .drag-handle { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #1b3350 0%, #05080f 75%); border: 3px solid #00d4ff; box-shadow: 0 0 0 4px rgba(0,212,255,.18), 0 6px 20px rgba(0,0,0,.7); transform: translate(-50%, -50%); z-index: 20; cursor: grab; touch-action: none; }
        .drag-handle::after { content: ""; position: absolute; inset: 0; margin: auto; width: 8px; height: 8px; border-radius: 50%; background: #00d4ff; box-shadow: 0 0 10px #00d4ff; }
        body.timer-running .drag-handle { display: none; }
        .circle-inner-display { position: absolute; inset: 16%; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-direction: column; background: radial-gradient(circle, #0e192b 0%, #050a14 100%); border: 1px solid #18273c; pointer-events: none; }
        .time-text { font-size: clamp(46px, 12vw, 62px); font-weight: 900; font-variant-numeric: tabular-nums; color: #fff; }
        .active-task-label { font-size: 11px; color: #7b93b4; font-weight: 700; margin-top: 4px; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .controls-group { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 28px; width: 100%; }
        .btn-primary { flex: 1; max-width: 180px; padding: 14px 28px; border: 0; border-radius: 18px; color: #fff; font-weight: 900; font-size: 18px; background: linear-gradient(135deg,#00d4ff 0%,#0052ff 100%); cursor: pointer; }
        .btn-secondary { width: 52px; height: 52px; border-radius: 18px; border: 1px solid #1a293e; background: #0d1726; color: #fff; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .mindmap-wrap { position: relative; width: 100%; min-height: 200px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 0; }
        .mindmap-center { padding: 14px 22px; border-radius: 20px; font-weight: 900; font-size: 16px; color: #04121f; background: linear-gradient(135deg,#00d4ff,#0052ff); box-shadow: 0 8px 24px rgba(0,150,255,.4); z-index: 2; margin-bottom: 6px; }
        .mindmap-day-group { width: 100%; margin-top: 14px; }
        .mindmap-day-head { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 30px; font-size: 13px; font-weight: 900; color: #fff; margin-bottom: 10px; background: #12233c; border: 1px solid #24405f; }
        .mindmap-day-head.free { background: rgba(52,199,89,.1); border-color: #1f5b3f; color: #6dffb0; }
        .mindmap-day-head.medium { background: rgba(255,180,0,.15); border-color: #5a4a1f; color: #ffd76a; }
        .mindmap-branches { display: flex; flex-wrap: wrap; gap: 8px; padding-right: 14px; border-right: 2px dashed #24405f; }
        .mindmap-node { padding: 9px 14px; border-radius: 14px; font-size: 13px; font-weight: 800; color: #cfe4fb; background: #0b1626; border: 1px solid #1c3352; }
        .mindmap-node b { color: #00d4ff; font-size: 11px; margin-right: 4px; }
        .empty-hint { text-align: center; color: #5d7a9c; font-size: 13px; font-weight: 700; padding: 24px 10px; }

        .drawer-overlay { position: fixed; inset: 0; background: rgba(2,6,14,.75); backdrop-filter: blur(6px); z-index: 999; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .side-drawer { position: fixed; top: 0; right: -100%; width: min(85vw,360px); height: 100vh; background: #070e1a; border-left: 1px solid #162438; z-index: 1000; transition: right .35s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; overflow-y: auto; }
        .side-drawer.open { right: 0; }
        .drawer-header { padding: 20px; background: #0b1322; border-bottom: 1px solid #162438; display: flex; justify-content: space-between; align-items: center; }
        .drawer-header h2 { font-size: 18px; font-weight: 900; color: #fff; }
        .menu-items-list { padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
        .menu-tab-btn { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; background: #0b1322; border: 1px solid #162438; border-radius: 16px; color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; transition: .25s ease; }
        .menu-tab-btn:active { border-color: #fff; transform: translateX(-4px); }

        .modal-page { position: fixed; inset: 0; background: rgba(3,8,18,.85); backdrop-filter: blur(10px); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .3s ease; }
        .modal-page.open { opacity: 1; pointer-events: auto; }
        .modal-card { width: 100%; max-width: 480px; max-height: 85vh; background: #0b1322; border: 1px solid #1a2c44; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 18px 20px; background: #070e1a; border-bottom: 1px solid #162438; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 17px; font-weight: 900; color: #fff; }
        .modal-body { padding: 20px; overflow-y: auto; }

        .schedule-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; background: #050a14; padding: 14px; border-radius: 16px; border: 1px solid #162438; }
        .form-input { flex: 1; padding: 10px; background: #0d1726; border: 1px solid #1a293e; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 700; }
        .btn-add-course { padding: 12px; background: linear-gradient(135deg,#00d4ff,#0052ff); border: none; border-radius: 10px; color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; }
        .schedule-list { display: flex; flex-direction: column; gap: 10px; list-style: none; }
        .schedule-card { display: flex; justify-content: space-between; align-items: center; background: #050a14; padding: 12px 14px; border-radius: 14px; border: 1px solid #162438; }
        .course-info strong { display: block; font-size: 14px; color: #fff; }
        .course-info span { font-size: 12px; color: #7b93b4; font-weight: 700; }
        .btn-del-course { background: transparent; border: none; color: #ff3b30; font-size: 16px; cursor: pointer; }

        .stat-box { text-align: center; padding: 16px 8px; background: #050a14; border: 1px solid #162438; border-radius: 16px; }
        .stat-box strong { display: block; font-size: 18px; font-weight: 900; color: #00d4ff; }
        .stat-box span { color: #b8c7dc; font-size: 13px; font-weight: 700; margin-top: 4px; display:block; }

        #toastStack { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; z-index: 20000; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; padding: 0 14px; }
        .app-toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 480px; width: 100%; background: #0d1726; border: 1px solid #1a293e; border-radius: 16px; padding: 13px 14px; box-shadow: 0 14px 34px rgba(0,0,0,.55); transform: translateY(-24px); opacity: 0; transition: transform .32s ease, opacity .32s ease; }
        .app-toast.show { transform: translateY(0); opacity: 1; }
        .app-toast .toast-msg { flex: 1; font-size: 13.5px; font-weight: 700; color: #e6edf7; line-height: 1.5; }
        .app-toast.toast-success { border-color: #1f5b3f; background: linear-gradient(135deg,#0d1726,#0d1f18); }
        .app-toast.toast-warning { border-color: #5a4a1f; background: linear-gradient(135deg,#0d1726,#241d0d); }
        .app-toast.toast-info { border-color: #1a293e; background: linear-gradient(135deg,#0d1726,#151d2e); }
        
        body.light-mode { background: #f2f6fa; color: #0f172a; }
        body.light-mode .timer-card, body.light-mode .side-drawer, body.light-mode .modal-card { background: #fff; border-color: #cbd5e1; }
        body.light-mode .icon-btn, body.light-mode .btn-secondary { background: #f8fafc; color: #0f172a; border-color: #cbd5e1; }
        body.light-mode .menu-tab-btn { background: #f1f5f9; border-color: #cbd5e1; color: #0f172a; }
        body.light-mode .circle-track { stroke: #dbe4ee; }
        body.light-mode .circle-inner-display { background: #fff; border-color: #cbd5e1; }
        body.light-mode .time-text { color: #0f172a; }
        body.light-mode .form-input, body.light-mode .schedule-card, body.light-mode .stat-box { background: #f8fafc; border-color: #cbd5e1; }
        body.light-mode .form-input { color: #0f172a; }
    </style>
</head>
<body>
    <div id="intro"><img src="intro.png" alt="FOCUS Intro"><div id="introTapHint">اضغط في أي مكان للبدء</div></div>
    
    <div id="app">
        <div class="header">
            <div class="brand">
                <img src="logo.png" alt="FOCUS Logo">
                <div class="brand-text">
                    <h1>FOCUS</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openModal('modalPrayer')" title="مواقيت الصلاة">🕌</button>
                <button class="icon-btn" onclick="toggleDrawer()" title="القائمة">☰</button>
            </div>
        </div>

        <div class="timer-card">
            <div class="circle-container" id="circleContainer">
                <svg class="circle-svg" viewBox="0 0 360 360">
                    <defs><linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#0052ff"/></linearGradient></defs>
                    <circle class="circle-track" cx="180" cy="180" r="160"/>
                    <circle class="circle-progress" id="circleProgress" cx="180" cy="180" r="160" stroke-dasharray="1005.3" stroke-dashoffset="0"/>
                </svg>
                <div class="drag-handle" id="dragHandle"></div>
                <div class="circle-inner-display">
                    <div class="time-text" id="timeText">25:00</div>
                    <div class="active-task-label" id="activeTaskLabel">🎯 لا توجد مهمة محددة</div>
                </div>
            </div>
            <div class="controls-group">
                <button class="btn-secondary" id="resetBtn" title="إعادة ضبط">🔄</button>
                <button class="btn-primary" id="startBtn">▶ ابدأ</button>
            </div>
        </div>

        <div class="mindmap-wrap" id="mindmapWrap">
            <div class="empty-hint">أضف مواعيدك من القائمة لتظهر هنا كخريطة ذهنية منظمة.</div>
        </div>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <h2>القائمة الرئيسية</h2>
            <button class="icon-btn" onclick="toggleDrawer()" style="width:36px;height:36px;font-size:18px;">✕</button>
        </div>
        <div class="menu-items-list">
            <button class="menu-tab-btn" onclick="openModal('modalSchedule')"><span>📅 إدارة المواعيد</span><span>◀</span></button>
            <button class="menu-tab-btn" onclick="openModal('modalPrayer')"><span>🕌 مواقيت الصلاة</span><span>◀</span></button>
        </div>
    </div>

    <!-- Modal: Schedule -->
    <div id="modalSchedule" class="modal-page">
        <div class="modal-card">
            <div class="modal-header">
                <h3>📅 إدارة المواعيد</h3>
                <button class="icon-btn" onclick="closeModal('modalSchedule')" style="width:36px;height:36px;font-size:18px;">✕</button>
            </div>
            <div class="modal-body">
                <div class="schedule-form">
                    <input type="text" id="courseTitle" class="form-input" placeholder="اسم الموعد / الدرس">
                    <div class="form-row">
                        <select id="courseDay" class="form-input">
                            <option value="الأحد">الأحد</option><option value="الإثنين">الإثنين</option><option value="الثلاثاء">الثلاثاء</option>
                            <option value="الأربعاء">الأربعاء</option><option value="الخميس">الخميس</option><option value="الجمعة">الجمعة</option><option value="السبت">السبت</option>
                        </select>
                        <input type="time" id="courseTime" class="form-input">
                    </div>
                    <button id="addCourseBtn" class="btn-add-course">إضافة موعد</button>
                </div>
                <ul class="schedule-list" id="scheduleList"></ul>
            </div>
        </div>
    </div>

    <!-- Modal: Prayer Times -->
    <div id="modalPrayer" class="modal-page">
        <div class="modal-card">
            <div class="modal-header">
                <h3>🕌 مواقيت الصلاة</h3>
                <button class="icon-btn" onclick="closeModal('modalPrayer')" style="width:36px;height:36px;font-size:18px;">✕</button>
            </div>
            <div class="modal-body">
                <div class="schedule-form" style="margin-bottom: 20px;">
                    <label style="font-size:13px; color:#8ca6ce; font-weight:700; margin-bottom:6px; display:block;">اختر محافظتك:</label>
                    <select id="prayerCitySelect" class="form-input" style="width:100%; padding:12px; cursor:pointer;">
                        <option value="">-- اختر المحافظة --</option>
                    </select>
                    <button id="savePrayerCityBtn" class="btn-add-course" style="margin-top:10px;">حفظ وتحديث المواقيت</button>
                </div>
                <div id="prayerLoading" style="text-align:center; padding:20px; color:#7b93b4; display:none;">جاري جلب المواقيت...</div>
                <div id="prayerError" style="text-align:center; padding:20px; color:#ff3b30; display:none;">تعذر جلب المواقيت، تأكد من الاتصال بالإنترنت.</div>
                <div id="prayerTimesDisplay" style="display:none;">
                    <div style="text-align:center; margin-bottom:16px; color:#7b93b4; font-size:13px; font-weight:700;" id="prayerDateDisplay"></div>
                    <div class="schedule-list" id="prayerGrid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastStack"></div>

    <script>
        // ========================= INTRO ==========================
        const intro = document.getElementById("intro");
        const introTapHint = document.getElementById("introTapHint");
        setTimeout(() => introTapHint.classList.add("show"), 1200);
        intro.addEventListener("click", () => {
            intro.classList.add("hide");
            setTimeout(() => intro.style.display = "none", 500);
        });

        // ========================= UTILS ==========================
        function showToast(msg, type = "info", duration = 4000) {
            const stack = document.getElementById("toastStack");
            const toast = document.createElement("div");
            toast.className = `app-toast toast-${type}`;
            toast.innerHTML = `<div class="toast-msg">${msg}</div>`;
            stack.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add("show"));
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 350);
            }, duration);
        }
        function openModal(id) { document.getElementById(id).classList.add("open"); toggleDrawer(false); }
        function closeModal(id) { document.getElementById(id).classList.remove("open"); }
        function toggleDrawer(forceState) {
            const isOpen = forceState !== undefined ? forceState : !document.getElementById("sideDrawer").classList.contains("open");
            document.getElementById("sideDrawer").classList.toggle("open", isOpen);
            document.getElementById("drawerOverlay").classList.toggle("open", isOpen);
        }

        // ========================= TIMER LOGIC ==========================
        let selectedMinutes = 25, remainingSeconds = 25 * 60;
        let isRunning = false, timerInterval = null, sessionStartTs = 0;
        const timeText = document.getElementById("timeText");
        const circleProgress = document.getElementById("circleProgress");
        const startBtn = document.getElementById("startBtn");
        const resetBtn = document.getElementById("resetBtn");
        const CIRCUMFERENCE = 2 * Math.PI * 160;

        function updateTimerDisplay() {
            const m = Math.floor(remainingSeconds / 60).toString().padStart(2, "0");
            const s = (remainingSeconds % 60).toString().padStart(2, "0");
            timeText.textContent = `${m}:${s}`;
            const progress = (selectedMinutes * 60 - remainingSeconds) / (selectedMinutes * 60);
            circleProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
        }

        function startTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                startBtn.textContent = "▶ استئناف";
                document.body.classList.remove("timer-running");
                stopMotivationalMessages();
                return;
            }
            isRunning = true;
            sessionStartTs = Date.now();
            startBtn.textContent = "⏸ إيقاف";
            document.body.classList.add("timer-running");
            startMotivationalMessages();
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    document.body.classList.remove("timer-running");
                    startBtn.textContent = "▶ ابدأ";
                    showToast("🎉 أحسنت! أكملت جلسة التركيز بنجاح.", "success", 6000);
                    stopMotivationalMessages();
                    try { new Audio("alarm.mp3").play().catch(()=>{}); } catch(e){}
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = selectedMinutes * 60;
            startBtn.textContent = "▶ ابدأ";
            document.body.classList.remove("timer-running");
            updateTimerDisplay();
            stopMotivationalMessages();
        }

        startBtn.onclick = startTimer;
        resetBtn.onclick = resetTimer;
        updateTimerDisplay();

        // ========================= MOTIVATIONAL MESSAGES ==========================
        const motivationalMessages = [
            "🌟 استمر، أنت تبني مستقبلاً رائعاً!", "💪 كل دقيقة تركيز تقربك من حلمك!",
            "🎯 التركيز هو مفتاح النجاح، وأنت تملكه!", "🚀 أنت أقوى مما تتخيل، استمر!",
            "✨ التميز ليس فعلاً بل عادة، وأنت تتدرب عليها!", "🏆 النجاح يبدأ بخطوة، وأنت تمشي بثبات!",
            "🤲 قال تعالى: {وَقُل رَّبِّ زِدْنِي عِلْمًا}", "🌙 طلب العلم فريضة على كل مسلم",
            "✨ من سلك طريقاً يلتمس فيه علماً سهل الله له به طريقاً إلى الجنة",
            "📖 العلم نور يقذفه الله في قلب من يشاء"
        ];
        let msgInterval = null;
        function startMotivationalMessages() {
            if (msgInterval) clearInterval(msgInterval);
            msgInterval = setInterval(() => {
                if (!isRunning) { clearInterval(msgInterval); return; }
                const randomMsg = motivationalMessages[Math.floor(Math.random() * motivationalMessages.length)];
                showToast(randomMsg, "info", 5000);
            }, 120000); // كل دقيقتين
        }
        function stopMotivationalMessages() { 
            if (msgInterval) { clearInterval(msgInterval); msgInterval = null; } 
        }

        // ========================= ADHKAR REMINDERS ==========================
        function checkAdhkarReminder() {
            const now = new Date();
            const currentTime = now.getHours() * 60 + now.getMinutes();
            const today = now.toDateString();
            const fajrStart = 4 * 60, fajrEnd = 5 * 60 + 30; // 4:00 - 5:30
            const maghribStart = 17 * 60 + 30, maghribEnd = 19 * 60; // 5:30 - 7:00
            
            let reminderType = null;
            if (currentTime >= fajrStart && currentTime <= fajrEnd) reminderType = "morning";
            else if (currentTime >= maghribStart && currentTime <= maghribEnd) reminderType = "evening";
            
            if (reminderType) {
                const reminderKey = `${today}_${reminderType}`;
                if (localStorage.getItem("lastAdhkarReminder") !== reminderKey) {
                    localStorage.setItem("lastAdhkarReminder", reminderKey);
                    const msg = reminderType === "morning" 
                        ? "🌅 حان وقت أذكار الصباح! اذكر الله يملأ قلبك سكينة."
                        : "🌇 حان وقت أذكار المساء! اذكر الله يحفظك من كل سوء.";
                    showToast(msg, "success", 8000);
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("FOCUS - تذكير بالأذكار 🤲", { body: msg, icon: "icon-192.png" });
                    }
                }
            }
        }
        setInterval(checkAdhkarReminder, 60000);
        checkAdhkarReminder();

        // ========================= SCHEDULE & MIND MAP ==========================
        let courses = JSON.parse(localStorage.getItem("focusSchedule") || "[]");
        const DAYS_ORDER = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

        function renderSchedule() {
            localStorage.setItem("focusSchedule", JSON.stringify(courses));
            const list = document.getElementById("scheduleList");
            list.innerHTML = "";
            courses.forEach((c, idx) => {
                const li = document.createElement("li");
                li.className = "schedule-card";
                li.innerHTML = `<div class="course-info"><strong>📖 ${c.title}</strong><span>📅 ${c.day} - ⏰ ${c.time}</span></div><button class="btn-del-course" onclick="deleteCourse(${idx})">🗑️</button>`;
                list.appendChild(li);
            });
            renderMindmap();
        }

        function deleteCourse(idx) {
            courses.splice(idx, 1);
            renderSchedule();
        }

        document.getElementById("addCourseBtn").onclick = () => {
            const title = document.getElementById("courseTitle").value.trim();
            const day = document.getElementById("courseDay").value;
            const time = document.getElementById("courseTime").value;
            if (!title || !time) { showToast("يرجى إدخال اسم الموعد والوقت!", "warning"); return; }
            courses.push({ title, day, time });
            document.getElementById("courseTitle").value = "";
            document.getElementById("courseTime").value = "";
            renderSchedule();
            showToast("تم إضافة الموعد بنجاح", "success");
        };

        function renderMindmap() {
            const wrap = document.getElementById("mindmapWrap");
            if (!courses.length) {
                wrap.innerHTML = '<div class="empty-hint">لا توجد مواعيد بعد.<br>أضف مواعيدك لتظهر هنا كخريطة ذهنية منظمة.</div>';
                return;
            }
            let html = '<div class="mindmap-center">🎯 مواعيدي</div>';
            DAYS_ORDER.forEach(day => {
                const dayCourses = courses.filter(c => c.day === day).sort((a, b) => a.time.localeCompare(b.time));
                if (!dayCourses.length) {
                    html += `<div class="mindmap-day-group"><div class="mindmap-day-head free">🟢 ${day} — يوم فاضي</div></div>`;
                } else if (dayCourses.length <= 2) {
                    html += `<div class="mindmap-day-group"><div class="mindmap-day-head medium">🟡 ${day} — يوم مذاكرة متوسطة</div><div class="mindmap-branches">`;
                    dayCourses.forEach(c => { html += `<div class="mindmap-node"><b>${c.time}</b> ${c.title}</div>`; });
                    html += `</div></div>`;
                } else {
                    html += `<div class="mindmap-day-group"><div class="mindmap-day-head">📅 ${day} (${dayCourses.length} موعد)</div><div class="mindmap-branches">`;
                    dayCourses.forEach(c => { html += `<div class="mindmap-node"><b>${c.time}</b> ${c.title}</div>`; });
                    html += `</div></div>`;
                }
            });
            wrap.innerHTML = html;
        }

        // ========================= PRAYER TIMES ==========================
        const prayerCitySelect = document.getElementById("prayerCitySelect");
        const egyptGovernorates = ["القاهرة", "الجيزة", "الإسكندرية", "الدقهلية", "البحر الأحمر", "البحيرة", "الفيوم", "الغربية", "الإسماعيلية", "المنوفية", "المنيا", "القليوبية", "الوادي الجديد", "السويس", "أسوان", "أسيوط", "بني سويف", "بورسعيد", "دمياط", "الشرقية", "جنوب سيناء", "كفر الشيخ", "مطروح", "الأقصر", "قنا", "شمال سيناء", "سوهاج"];
        
        egyptGovernorates.forEach(city => {
            const opt = document.createElement("option");
            opt.value = city;
            opt.textContent = city;
            prayerCitySelect.appendChild(opt);
        });

        const savedCity = localStorage.getItem("focusPrayerCity");
        if (savedCity) {
            prayerCitySelect.value = savedCity;
            fetchPrayerTimes(savedCity);
        }

        document.getElementById("savePrayerCityBtn").onclick = () => {
            const city = prayerCitySelect.value;
            if (!city) { showToast("يرجى اختيار المحافظة أولاً", "warning"); return; }
            localStorage.setItem("focusPrayerCity", city);
            fetchPrayerTimes(city);
            showToast("تم حفظ المحافظة وتحديث المواقيت", "success");
        };

        async function fetchPrayerTimes(city) {
            const display = document.getElementById("prayerTimesDisplay");
            const loading = document.getElementById("prayerLoading");
            const error = document.getElementById("prayerError");
            const grid = document.getElementById("prayerGrid");
            const dateDisplay = document.getElementById("prayerDateDisplay");

            display.style.display = "none";
            error.style.display = "none";
            loading.style.display = "block";

            try {
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=Egypt&method=5`);
                const data = await response.json();
                if (data.code === 200) {
                    const timings = data.data.timings;
                    const hijriDate = data.data.date.hijri;
                    dateDisplay.textContent = `${data.data.date.readable} | ${hijriDate.day} ${hijriDate.month.ar} ${hijriDate.year}`;
                    
                    const prayers = [
                        { key: "Fajr", name: "الفجر", icon: "🌅" },
                        { key: "Dhuhr", name: "الظهر", icon: "☀️" },
                        { key: "Asr", name: "العصر", icon: "🌤️" },
                        { key: "Maghrib", name: "المغرب", icon: "🌇" },
                        { key: "Isha", name: "العشاء", icon: "🌙" }
                    ];
                    grid.innerHTML = prayers.map(p => `
                        <div class="stat-box">
                            <div style="font-size: 24px; margin-bottom: 6px;">${p.icon}</div>
                            <strong>${timings[p.key]}</strong>
                            <span>${p.name}</span>
                        </div>
                    `).join("");
                    loading.style.display = "none";
                    display.style.display = "block";
                } else { throw new Error("API Error"); }
            } catch (err) {
                loading.style.display = "none";
                error.style.display = "block";
            }
        }

        // ========================= INIT ==========================
        renderSchedule();
        if ("Notification" in window) Notification.requestPermission();
    </script>
</body>
</html>
